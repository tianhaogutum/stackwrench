# Local infrastructure for the demo app. Synthetic; nothing here is started.
services:
  redis:
    image: redis:7.4.1
    command: ["redis-server", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      start_period: 5s
      start_interval: 1s
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
